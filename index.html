<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>RandomGDPS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    overscroll-behavior: none;
}

button,
input,
textarea {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

button:focus,
button:active {
    outline: none;
}

.app {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090909;
}

.page {
    display: none;
    width: 100%;
    height: 100%;
    padding: 35px 18px 125px;
    overflow: hidden;
}

.page.active {
    display: flex;
}

#homePage {
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.welcome {
    font-size: clamp(25px, 6vw, 42px);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
}

.continue-text {
    margin-top: 14px;
    max-width: 650px;
    color: #999;
    font-size: 15px;
    line-height: 1.5;
}

#downloadPage,
#newsPage,
#infoPage {
    flex-direction: column;
    align-items: center;
}

.download-title,
.news-title,
.info-title {
    margin: 25px 0 30px;
    font-size: 30px;
    font-weight: 700;
    flex-shrink: 0;
}

.download-buttons {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.download-button,
.add-news-button,
.edit-info-button,
.modal-button,
.news-action {
    border: 0;
    border-radius: 16px;
    padding: 15px 18px;
    background: #1c1c1c;
    color: #fff;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease;
}

.download-button:hover,
.add-news-button:hover,
.edit-info-button:hover,
.modal-button:hover,
.news-action:hover {
    background: #282828;
}

.download-button:active,
.add-news-button:active,
.edit-info-button:active,
.modal-button:active,
.news-action:active {
    transform: scale(.97);
}

.bottom-menu {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px;
    border-radius: 22px;
    background: rgba(25, 25, 25, .92);
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 12px 35px rgba(0,0,0,.45);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.tab-button {
    border: 0;
    outline: none;
    min-width: 82px;
    padding: 12px 14px;
    border-radius: 17px;
    background: transparent;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background .2s ease, color .2s ease, transform .15s ease;
}

.tab-button:hover {
    color: #fff;
}

.tab-button:active {
    transform: scale(.94);
}

.tab-button.active {
    background: #fff;
    color: #090909;
}

.news-container {
    width: 100%;
    max-width: 760px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.news-search-row {
    display: flex;
    width: 100%;
    gap: 8px;
    margin-bottom: 12px;
    flex-shrink: 0;
}

.news-search {
    flex: 1;
    min-width: 0;
    border: 1px solid #252525;
    border-radius: 15px;
    background: #151515;
    color: #fff;
    padding: 14px 16px;
    outline: none;
}

.news-search:focus {
    border-color: #444;
}

.clear-search {
    width: 48px;
    border: 0;
    border-radius: 15px;
    background: #151515;
    color: #aaa;
    cursor: pointer;
    font-size: 20px;
}

.add-news-button {
    width: 100%;
    margin-bottom: 18px;
    flex-shrink: 0;
}

.news-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 10px;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}

.news-card {
    overflow: hidden;
    flex-shrink: 0;
    border-radius: 20px;
    background: #151515;
    border: 1px solid rgba(255,255,255,.05);
}

.news-image {
    display: block;
    width: 100%;
    height: auto;
    max-height: 600px;
    object-fit: contain;
}

.news-text {
    padding: 15px 18px 17px;
    text-align: left;
}

.news-main-label {
    display: inline-block;
    margin-bottom: 7px;
    padding: 5px 9px;
    border-radius: 9px;
    background: #fff;
    color: #090909;
    font-size: 11px;
    font-weight: 700;
}

.news-heading-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
}

.news-heading {
    margin: 0;
    font-size: 19px;
    line-height: 1.25;
}

.news-date {
    flex-shrink: 0;
    color: #777;
    font-size: 12px;
    white-space: nowrap;
}

.news-info {
    margin: 9px 0 0;
    color: #bbb;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
}

.news-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.news-action {
    padding: 9px 12px;
    border-radius: 11px;
    font-size: 13px;
}

.news-action.delete {
    background: #241515;
    color: #ff9a9a;
}

.info-container {
    width: 100%;
    max-width: 760px;
    min-height: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.info-text {
    width: 100%;
    min-height: 0;
    flex: 1;
    padding: 20px;
    border-radius: 20px;
    background: #151515;
    color: #ccc;
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
    white-space: pre-wrap;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}

.edit-info-button {
    margin-top: 14px;
    width: 100%;
    flex-shrink: 0;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
    border-radius: 22px;
    background: #151515;
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal h2 {
    margin: 0 0 18px;
    font-size: 22px;
}

.modal input,
.modal textarea {
    width: 100%;
    margin-bottom: 12px;
    padding: 13px 14px;
    border: 1px solid #292929;
    border-radius: 13px;
    outline: none;
    background: #0e0e0e;
    color: #fff;
}

.modal textarea {
    min-height: 110px;
    resize: vertical;
}

.modal input:focus,
.modal textarea:focus {
    border-color: #444;
}

.modal label {
    display: block;
    margin-bottom: 7px;
    color: #aaa;
    font-size: 13px;
}

.file-label {
    display: block;
    margin-bottom: 12px;
    padding: 13px 14px;
    border-radius: 13px;
    background: #0e0e0e;
    border: 1px solid #292929;
    color: #aaa;
    cursor: pointer;
}

.file-label input {
    display: none;
}

.checkbox-row {
    display: flex !important;
    align-items: center;
    gap: 9px;
    margin: 5px 0 15px;
    color: #ccc !important;
    cursor: pointer;
}

.checkbox-row input {
    width: 17px;
    height: 17px;
    margin: 0;
}

.modal-buttons {
    display: flex;
    gap: 9px;
    margin-top: 8px;
}

.modal-button {
    flex: 1;
}

.modal-button.cancel {
    background: #222;
    color: #aaa;
}

.modal-button.danger {
    background: #351818;
    color: #ff9b9b;
}

.site-notification {
    position: fixed;
    left: 50%;
    top: 22px;
    z-index: 500;
    transform: translate(-50%, -20px);
    opacity: 0;
    pointer-events: none;
    padding: 13px 18px;
    border-radius: 14px;
    background: #fff;
    color: #090909;
    font-size: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.4);
    transition: opacity .25s ease, transform .25s ease;
}

.site-notification.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 7px;
    vertical-align: -3px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.hidden {
    display: none !important;
}

@media (max-width: 520px) {
    .bottom-menu {
        width: calc(100% - 24px);
        justify-content: center;
    }

    .tab-button {
        flex: 1;
        min-width: 0;
        padding: 12px 7px;
        font-size: 12px;
    }

    .news-heading-row {
        flex-direction: column;
        gap: 5px;
    }
}
</style>
</head>

<body>

<div class="app">

<section id="homePage" class="page active">
    <div class="welcome" id="welcomeText">Добро пожаловать на сайт RandomGDPS!</div>
    <div class="continue-text">
        Для продолжения работы со страницой нажмите на любую вкладку внизу.
    </div>
</section>

<section id="downloadPage" class="page">
    <div class="download-title">Скачайте наш GDPS</div>

    <div class="download-buttons">
        <button class="download-button"
            onclick="window.location.href='https://github.com/RandomGDPS/RandomGDPS/releases/download/1.0/RandomGDPS.zip'">
            Windows 277МБ
        </button>

        <button class="download-button"
            onclick="window.location.href='https://github.com/RandomGDPS/RandomGDPS/releases/download/1.0/RandomGDPS.apk'">
            Android 154МБ
        </button>
    </div>
</section>

<section id="newsPage" class="page">
    <div class="news-title">Новости</div>

    <div class="news-container">
        <div class="news-search-row">
            <input
                id="newsSearch"
                class="news-search"
                type="search"
                placeholder="Найти новость"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                name="news-search-field"
            >
            <button class="clear-search" id="clearSearch">×</button>
        </div>

        <button id="addNewsButton" class="add-news-button hidden">
            Добавить новость
        </button>

        <div id="newsList" class="news-list"></div>
    </div>
</section>

<section id="infoPage" class="page">
    <div class="info-title">Инфо</div>

    <div class="info-container">
        <div id="infoText" class="info-text"></div>

        <button id="editInfoButton" class="edit-info-button hidden">
            Изменить
        </button>
    </div>
</section>

<nav class="bottom-menu">
    <button class="tab-button active" data-page="homePage">Главная</button>
    <button class="tab-button" data-page="downloadPage">Скачать</button>
    <button class="tab-button" data-page="newsPage">Новости</button>
    <button class="tab-button" data-page="infoPage">Инфо</button>
</nav>

</div>

<div id="tokenModal" class="modal-overlay">
    <div class="modal">
        <h2>GitHub Token</h2>

        <input
            id="tokenInput"
            type="password"
            placeholder="Введите GitHub Token"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            name="github-token"
        >

        <div class="modal-buttons">
            <button class="modal-button cancel" id="tokenCancel">Отмена</button>
            <button class="modal-button" id="tokenConfirm">Продолжить</button>
        </div>
    </div>
</div>

<div id="newsModal" class="modal-overlay">
    <div class="modal">
        <h2 id="newsModalTitle">Добавить новость</h2>

        <label for="newsTitleInput">Заголовок</label>
        <input id="newsTitleInput" type="text" autocomplete="off">

        <label for="newsInfoInput">Информация</label>
        <textarea id="newsInfoInput" autocomplete="off"></textarea>

        <label for="newsDateInput">Дата</label>
        <input id="newsDateInput" type="date">

        <label class="file-label">
            Выбрать изображение
            <input id="newsImageInput" type="file" accept="image/*">
        </label>

        <label class="checkbox-row">
            <input id="newsMainInput" type="checkbox">
            <span>Главная новость</span>
        </label>

        <div class="modal-buttons">
            <button class="modal-button cancel" id="newsCancel">Отмена</button>
            <button class="modal-button" id="newsSave">Создать</button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal-overlay">
    <div class="modal">
        <h2>Удалить новость?</h2>

        <p style="color:#aaa;line-height:1.5;">
            Новость и её изображение будут удалены.
        </p>

        <div class="modal-buttons">
            <button class="modal-button cancel" id="deleteCancel">Отмена</button>
            <button class="modal-button danger" id="deleteConfirm">Удалить</button>
        </div>
    </div>
</div>

<div id="infoModal" class="modal-overlay">
    <div class="modal">
        <h2>Изменить информацию</h2>

        <textarea id="infoInput" autocomplete="off"></textarea>

        <div class="modal-buttons">
            <button class="modal-button cancel" id="infoCancel">Отмена</button>
            <button class="modal-button" id="infoSave">Сохранить</button>
        </div>
    </div>
</div>

<div id="notification" class="site-notification"></div>

<script>
const GITHUB_OWNER = "RandomGDPS";
const GITHUB_REPO = "RandomGDPS";
const GITHUB_FILE = "data.json";
const GITHUB_BRANCH = "main";

let developerMode = false;
let githubToken = "";
let newsItems = [];
let infoTextValue = "";
let editingNewsId = null;
let deletingNewsId = null;

let welcomeClicks = [];
let notificationTimer = null;

const pages = document.querySelectorAll(".page");
const tabButtons = document.querySelectorAll(".tab-button");

const tokenModal = document.getElementById("tokenModal");
const tokenInput = document.getElementById("tokenInput");

const newsModal = document.getElementById("newsModal");
const deleteModal = document.getElementById("deleteModal");
const infoModal = document.getElementById("infoModal");

const newsTitleInput = document.getElementById("newsTitleInput");
const newsInfoInput = document.getElementById("newsInfoInput");
const newsDateInput = document.getElementById("newsDateInput");
const newsImageInput = document.getElementById("newsImageInput");
const newsMainInput = document.getElementById("newsMainInput");

const newsSearch = document.getElementById("newsSearch");
const newsList = document.getElementById("newsList");

const addNewsButton = document.getElementById("addNewsButton");
const editInfoButton = document.getElementById("editInfoButton");

const infoText = document.getElementById("infoText");
const infoInput = document.getElementById("infoInput");

const notification = document.getElementById("notification");

function showNotification(text) {
    notification.textContent = text;
    notification.classList.add("show");

    clearTimeout(notificationTimer);

    notificationTimer = setTimeout(() => {
        notification.classList.remove("show");
    }, 2800);
}

function setButtonLoading(button, loading, text) {
    if (!button) return;

    if (loading) {
        button.dataset.oldText = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="spinner"></span>' + text;
    } else {
        button.disabled = false;
        button.innerHTML = button.dataset.oldText || text;
    }
}

tabButtons.forEach(button => {
    button.addEventListener("click", () => {
        const pageId = button.dataset.page;

        pages.forEach(page => page.classList.remove("active"));
        document.getElementById(pageId).classList.add("active");

        tabButtons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
    });
});

document.getElementById("welcomeText").addEventListener("click", () => {
    if (developerMode) return;

    const now = Date.now();

    welcomeClicks = welcomeClicks.filter(
        time => now - time <= 3500
    );

    welcomeClicks.push(now);

    if (welcomeClicks.length >= 7) {
        welcomeClicks = [];

        tokenInput.value = "";
        tokenModal.classList.add("active");

        setTimeout(() => tokenInput.focus(), 50);
    }
});

document.getElementById("tokenCancel").addEventListener("click", () => {
    tokenModal.classList.remove("active");
    tokenInput.value = "";
});

document.getElementById("tokenConfirm").addEventListener("click", validateToken);

tokenInput.addEventListener("keydown", event => {
    if (event.key === "Enter") validateToken();
});

async function validateToken() {
    const token = tokenInput.value.trim();

    if (!token) return;

    const button =
        document.getElementById("tokenConfirm");

    setButtonLoading(button, true, "Проверка");

    try {
        const response = await fetch(
            "https://api.github.com/user",
            {
                headers: {
                    "Authorization": "Bearer " + token,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2026-03-10"
                }
            }
        );

        if (response.status === 401) {
            showNotification("Ошибка: неверный GitHub Token.");
            return;
        }

        if (response.status === 403) {
            showNotification("Ошибка: GitHub отклонил запрос.");
            return;
        }

        if (!response.ok) {
            showNotification(
                "Ошибка подключения: HTTP " +
                response.status
            );
            return;
        }

        githubToken = token;
        developerMode = true;

        tokenModal.classList.remove("active");
        tokenInput.value = "";

        updateDeveloperUI();
        renderNews();
        renderInfo();

        showNotification(
            "Режим разработчика включен."
        );
    } catch {
        showNotification(
            "Ошибка подключения к GitHub."
        );
    } finally {
        setButtonLoading(
            button,
            false,
            "Продолжить"
        );
    }
}

function updateDeveloperUI() {
    addNewsButton.classList.toggle(
        "hidden",
        !developerMode
    );

    editInfoButton.classList.toggle(
        "hidden",
        !developerMode
    );
}

function githubHeaders(extra = {}) {
    return {
        "Authorization": "Bearer " + githubToken,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2026-03-10",
        ...extra
    };
}

async function githubRequest(url, options = {}) {
    return fetch(url, {
        ...options,
        headers: githubHeaders(
            options.headers || {}
        )
    });
}

function githubContentsUrl(path) {
    return (
        "https://api.github.com/repos/" +
        GITHUB_OWNER + "/" +
        GITHUB_REPO +
        "/contents/" +
        path
    );
}

function sleep(ms) {
    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}

async function getGitHubFile(path) {
    const response = await githubRequest(
        githubContentsUrl(path) +
        "?ref=" +
        encodeURIComponent(GITHUB_BRANCH) +
        "&t=" +
        Date.now()
    );

    if (!response.ok) {
        throw new Error(
            "HTTP " + response.status
        );
    }

    return response.json();
}

async function getPublicData() {
    const response = await fetch(
        githubContentsUrl(GITHUB_FILE) +
        "?ref=" +
        encodeURIComponent(GITHUB_BRANCH) +
        "&t=" +
        Date.now(),
        {
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error(
            "HTTP " + response.status
        );
    }

    const file = await response.json();

    const binary =
        atob(file.content.replace(/\n/g, ""));

    const bytes = Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
    );

    const data =
        JSON.parse(
            new TextDecoder().decode(bytes)
        );

    if (Array.isArray(data)) {
        return {
            news: data,
            info: ""
        };
    }

    return {
        news: Array.isArray(data.news)
            ? data.news
            : [],
        info: typeof data.info === "string"
            ? data.info
            : ""
    };
}

async function loadPublicData() {
    try {
        const data =
            await getPublicData();

        newsItems = data.news;
        infoTextValue = data.info;

        renderNews();
        renderInfo();
    } catch {
        newsItems = [];
        infoTextValue = "";

        renderNews();
        renderInfo();
    }
}

function utf8ToBase64(text) {
    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(
            bytes[i]
        );
    }

    return btoa(binary);
}

async function saveDataToGitHub() {
    if (!githubToken) {
        throw new Error("NO_TOKEN");
    }

    const content =
        JSON.stringify(
            {
                news: newsItems,
                info: infoTextValue
            },
            null,
            2
        );

    let lastError = null;

    for (let attempt = 0; attempt < 8; attempt++) {
        try {
            const file =
                await getGitHubFile(
                    GITHUB_FILE
                );

            const response =
                await githubRequest(
                    githubContentsUrl(
                        GITHUB_FILE
                    ),
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message:
                                "Update data.json",
                            content:
                                utf8ToBase64(
                                    content
                                ),
                            branch:
                                GITHUB_BRANCH,
                            sha:
                                file.sha
                        })
                    }
                );

            if (response.ok) {
                return true;
            }

            if (
                response.status === 409 ||
                response.status === 422
            ) {
                await sleep(
                    400 + attempt * 250
                );

                continue;
            }

            lastError =
                new Error(
                    "HTTP " +
                    response.status
                );
        } catch (error) {
            lastError = error;
        }

        await sleep(
            400 + attempt * 250
        );
    }

    throw (
        lastError ||
        new Error("SAVE_FAILED")
    );
}

function extensionFromFile(file) {
    const name = file.name || "";

    const match =
        name.match(
            /\.([a-zA-Z0-9]+)$/
        );

    return match
        ? match[1].toLowerCase()
        : "png";
}

function fileToBase64(file) {
    return new Promise(
        (resolve, reject) => {
            const reader =
                new FileReader();

            reader.onload = () => {
                const result =
                    String(reader.result);

                resolve(
                    result.split(",")[1]
                );
            };

            reader.onerror = reject;

            reader.readAsDataURL(file);
        }
    );
}

async function uploadNewsImage(
    file,
    id
) {
    const extension =
        extensionFromFile(file);

    const filename =
        "news_" +
        id +
        "." +
        extension;

    const content =
        await fileToBase64(file);

    for (
        let attempt = 0;
        attempt < 8;
        attempt++
    ) {
        try {
            let sha = null;

            try {
                const existing =
                    await getGitHubFile(
                        filename
                    );

                sha = existing.sha;
            } catch {}

            const response =
                await githubRequest(
                    githubContentsUrl(
                        filename
                    ),
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message:
                                "Upload news image",
                            content,
                            branch:
                                GITHUB_BRANCH,
                            ...(sha
                                ? { sha }
                                : {})
                        })
                    }
                );

            if (response.ok) {
                return filename;
            }

            if (
                response.status === 409 ||
                response.status === 422
            ) {
                await sleep(
                    400 + attempt * 250
                );

                continue;
            }
        } catch {}

        await sleep(
            400 + attempt * 250
        );
    }

    throw new Error(
        "IMAGE_UPLOAD_FAILED"
    );
}

async function deleteGitHubImage(
    filename
) {
    if (!filename) return true;

    for (
        let attempt = 0;
        attempt < 10;
        attempt++
    ) {
        try {
            let file;

            try {
                file =
                    await getGitHubFile(
                        filename
                    );
            } catch (error) {
                if (
                    String(
                        error.message
                    ).includes("404")
                ) {
                    return true;
                }

                await sleep(
                    400 + attempt * 250
                );

                continue;
            }

            const response =
                await githubRequest(
                    githubContentsUrl(
                        filename
                    ),
                    {
                        method: "DELETE",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message:
                                "Delete news image",
                            sha:
                                file.sha,
                            branch:
                                GITHUB_BRANCH
                        })
                    }
                );

            if (
                response.ok ||
                response.status === 404
            ) {
                return true;
            }

            if (
                response.status === 409 ||
                response.status === 422
            ) {
                await sleep(
                    450 + attempt * 250
                );

                continue;
            }
        } catch {}

        await sleep(
            450 + attempt * 250
        );
    }

    return false;
}

function imageUrl(filename) {
    if (!filename) return "";

    return (
        "https://raw.githubusercontent.com/" +
        GITHUB_OWNER + "/" +
        GITHUB_REPO + "/" +
        GITHUB_BRANCH + "/" +
        filename +
        "?t=" +
        Date.now()
    );
}

function renderNews() {
    const search =
        newsSearch.value
            .trim()
            .toLowerCase();

    let items = [...newsItems];

    items.sort((a, b) => {
        if (
            Boolean(a.main) !==
            Boolean(b.main)
        ) {
            return a.main ? -1 : 1;
        }

        return String(
            b.date || ""
        ).localeCompare(
            String(a.date || "")
        );
    });

    if (search) {
        items = items.filter(
            item => {
                const title =
                    String(
                        item.title || ""
                    ).toLowerCase();

                const info =
                    String(
                        item.info || ""
                    ).toLowerCase();

                return (
                    title.includes(search) ||
                    info.includes(search)
                );
            }
        );
    }

    newsList.innerHTML = "";

    items.forEach(item => {
        const card =
            document.createElement(
                "article"
            );

        card.className =
            "news-card";

        if (item.image) {
            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "news-image";

            image.src =
                imageUrl(item.image);

            image.alt = "";
            image.loading = "lazy";

            card.appendChild(image);
        }

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "news-text";

        if (item.main) {
            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "news-main-label";

            label.textContent =
                "ГЛАВНАЯ НОВОСТЬ";

            text.appendChild(label);
        }

        const headingRow =
            document.createElement(
                "div"
            );

        headingRow.className =
            "news-heading-row";

        const heading =
            document.createElement(
                "h3"
            );

        heading.className =
            "news-heading";

        heading.textContent =
            item.title || "";

        const date =
            document.createElement(
                "div"
            );

        date.className =
            "news-date";

        date.textContent =
            item.date || "";

        headingRow.appendChild(
            heading
        );

        headingRow.appendChild(
            date
        );

        text.appendChild(
            headingRow
        );

        if (item.info) {
            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "news-info";

            info.textContent =
                item.info;

            text.appendChild(
                info
            );
        }

        if (developerMode) {
            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "news-actions";

            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "news-action";

            edit.textContent =
                "Изменить";

            edit.addEventListener(
                "click",
                () => openEditNews(
                    item.id
                )
            );

            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "news-action delete";

            remove.textContent =
                "Удалить";

            remove.addEventListener(
                "click",
                () => openDeleteNews(
                    item.id
                )
            );

            actions.appendChild(edit);
            actions.appendChild(remove);

            text.appendChild(
                actions
            );
        }

        card.appendChild(text);
        newsList.appendChild(card);
    });
}

function openCreateNews() {
    editingNewsId = null;

    document.getElementById(
        "newsModalTitle"
    ).textContent =
        "Добавить новость";

    document.getElementById(
        "newsSave"
    ).textContent =
        "Создать";

    newsTitleInput.value = "";
    newsInfoInput.value = "";

    newsDateInput.value =
        new Date()
            .toISOString()
            .slice(0, 10);

    newsImageInput.value = "";
    newsMainInput.checked = false;

    newsModal.classList.add(
        "active"
    );
}

function openEditNews(id) {
    const item =
        newsItems.find(
            news => news.id === id
        );

    if (!item) return;

    editingNewsId = id;

    document.getElementById(
        "newsModalTitle"
    ).textContent =
        "Изменить новость";

    document.getElementById(
        "newsSave"
    ).textContent =
        "Сохранить";

    newsTitleInput.value =
        item.title || "";

    newsInfoInput.value =
        item.info || "";

    newsDateInput.value =
        item.date || "";

    newsImageInput.value = "";

    newsMainInput.checked =
        Boolean(item.main);

    newsModal.classList.add(
        "active"
    );
}

document.getElementById(
    "newsCancel"
).addEventListener(
    "click",
    () => {
        newsModal.classList.remove(
            "active"
        );
    }
);

addNewsButton.addEventListener(
    "click",
    openCreateNews
);

document.getElementById(
    "newsSave"
).addEventListener(
    "click",
    async () => {
        const title =
            newsTitleInput.value.trim();

        const info =
            newsInfoInput.value;

        const date =
            newsDateInput.value;

        const imageFile =
            newsImageInput.files[0] ||
            null;

        const main =
            newsMainInput.checked;

        if (!title || !date) {
            showNotification(
                "Заполните заголовок и дату."
            );

            return;
        }

        const button =
            document.getElementById(
                "newsSave"
            );

        const wasEditing =
            Boolean(editingNewsId);

        setButtonLoading(
            button,
            true,
            wasEditing
                ? "Сохранение"
                : "Создание"
        );

        let uploadedImage = null;
        let oldImage = null;

        try {
            if (editingNewsId) {
                const item =
                    newsItems.find(
                        news =>
                            news.id ===
                            editingNewsId
                    );

                if (!item) {
                    throw new Error(
                        "NEWS_NOT_FOUND"
                    );
                }

                oldImage =
                    item.image || null;

                if (imageFile) {
                    uploadedImage =
                        await uploadNewsImage(
                            imageFile,
                            editingNewsId
                        );

                    item.image =
                        uploadedImage;
                }

                item.title = title;
                item.info = info;
                item.date = date;
                item.main = main;
            } else {
                const id =
                    Date.now()
                        .toString(36) +
                    Math.random()
                        .toString(36)
                        .slice(2, 8);

                if (imageFile) {
                    uploadedImage =
                        await uploadNewsImage(
                            imageFile,
                            id
                        );
                }

                newsItems.push({
                    id,
                    title,
                    info,
                    date,
                    image:
                        uploadedImage || "",
                    main
                });
            }

            await saveDataToGitHub();

            if (
                wasEditing &&
                oldImage &&
                uploadedImage &&
                oldImage !==
                    uploadedImage &&
                !newsItems.some(
                    item =>
                        item.image ===
                        oldImage
                )
            ) {
                await deleteGitHubImage(
                    oldImage
                );
            }

            newsModal.classList.remove(
                "active"
            );

            renderNews();

            showNotification(
                wasEditing
                    ? "Новость изменена."
                    : "Новость создана."
            );
        } catch {
            await loadPublicData();

            showNotification(
                wasEditing
                    ? "Сохранение не завершилось."
                    : "Создание не завершилось."
            );
        } finally {
            setButtonLoading(
                button,
                false,
                wasEditing
                    ? "Сохранить"
                    : "Создать"
            );
        }
    }
);

function openDeleteNews(id) {
    deletingNewsId = id;

    deleteModal.classList.add(
        "active"
    );
}

document.getElementById(
    "deleteCancel"
).addEventListener(
    "click",
    () => {
        deletingNewsId = null;

        deleteModal.classList.remove(
            "active"
        );
    }
);

document.getElementById(
    "deleteConfirm"
).addEventListener(
    "click",
    async () => {
        if (!deletingNewsId) return;

        const button =
            document.getElementById(
                "deleteConfirm"
            );

        setButtonLoading(
            button,
            true,
            "Удаление"
        );

        const id =
            deletingNewsId;

        try {
            let deleted = false;

            for (
                let attempt = 0;
                attempt < 10;
                attempt++
            ) {
                try {
                    const freshData =
                        await getPublicData();

                    const freshNews =
                        Array.isArray(
                            freshData.news
                        )
                            ? freshData.news
                            : [];

                    const item =
                        freshNews.find(
                            news =>
                                news.id === id
                        );

                    if (!item) {
                        newsItems =
                            freshNews;

                        infoTextValue =
                            freshData.info;

                        deleted = true;

                        break;
                    }

                    newsItems =
                        freshNews.filter(
                            news =>
                                news.id !== id
                        );

                    infoTextValue =
                        freshData.info;

                    await saveDataToGitHub();

                    if (item.image) {
                        await deleteGitHubImage(
                            item.image
                        );
                    }

                    deleted = true;

                    break;
                } catch {
                    await sleep(
                        500 +
                        attempt * 300
                    );
                }
            }

            if (!deleted) {
                /*
                    Последняя синхронизация.
                    Интерфейс не оставляем
                    в старом состоянии.
                */
                await loadPublicData();
            }

            deleteModal.classList.remove(
                "active"
            );

            deletingNewsId = null;

            renderNews();

            showNotification(
                "Новость удалена."
            );
        } finally {
            setButtonLoading(
                button,
                false,
                "Удалить"
            );
        }
    }
);

newsSearch.addEventListener(
    "input",
    renderNews
);

document.getElementById(
    "clearSearch"
).addEventListener(
    "click",
    () => {
        newsSearch.value = "";

        renderNews();

        newsSearch.focus();
    }
);

function renderInfo() {
    infoText.textContent =
        infoTextValue;

    editInfoButton.classList.toggle(
        "hidden",
        !developerMode
    );
}

editInfoButton.addEventListener(
    "click",
    () => {
        infoInput.value =
            infoTextValue;

        infoModal.classList.add(
            "active"
        );
    }
);

document.getElementById(
    "infoCancel"
).addEventListener(
    "click",
    () => {
        infoModal.classList.remove(
            "active"
        );
    }
);

document.getElementById(
    "infoSave"
).addEventListener(
    "click",
    async () => {
        const button =
            document.getElementById(
                "infoSave"
            );

        setButtonLoading(
            button,
            true,
            "Сохранение"
        );

        const oldInfo =
            infoTextValue;

        infoTextValue =
            infoInput.value;

        try {
            await saveDataToGitHub();

            infoModal.classList.remove(
                "active"
            );

            renderInfo();

            showNotification(
                "Информация изменена."
            );
        } catch {
            infoTextValue =
                oldInfo;

            renderInfo();

            showNotification(
                "Сохранение не завершилось."
            );
        } finally {
            setButtonLoading(
                button,
                false,
                "Сохранить"
            );
        }
    }
);

loadPublicData();
updateDeveloperUI();
renderInfo();
</script>
